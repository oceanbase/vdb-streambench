[project]
name = "vdb-streambench"
version = "0.1.0"
description = "Benchmark vector databases with VectorDBBench StreamingPerformanceCase"
requires-python = ">=3.11"
dependencies = [
    "vectordb-bench[qdrant,elastic,chromadb,lancedb,seekdb]",
    "python-dotenv",
    "tabulate",
    "pysqlite3-binary",
    "protobuf>=5.27.2,<7",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-proto==1.41.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.41.1",
]

[tool.setuptools]
py-modules = ["run_bench"]
